apiVersion: 1

policies:
  - orgId: 1
    receiver: slack-p2-p3
    group_by: [alertname, service]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: pagerduty-p1
        object_matchers:
          - [severity, "=", P1]
        group_wait: 10s
        repeat_interval: 1h
      - receiver: slack-p2-p3
        object_matchers:
          - [severity, "=~", "P2|P3"]
