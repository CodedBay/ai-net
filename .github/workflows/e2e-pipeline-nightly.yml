name: E2E Pipeline Tests (Nightly)

# Nightly job that runs the full 5-agent market report pipeline against the
# backend with Stellar testnet payment verification.
#
# Expected runtime: 60-120 seconds for the pipeline + Horizon polling.
# Total job timeout: 15 minutes.
#
# Set RUN_STELLAR_E2E_TESTS=true and supply STELLAR_COORDINATOR_SECRET to
# enable real testnet payment verification. Without the secret, idempotency
# and mock-dispatch pipeline tests still run.

on:
  schedule:
    # Daily 02:00 UTC — off-peak to avoid hammering the shared testnet RPC.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      run_stellar:
        description: "Enable Stellar testnet payment verification"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

concurrency:
  group: e2e-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write   # to open/comment on breakage issues

jobs:
  e2e-pipeline:
    name: e2e-full-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Check if Stellar secrets are available
        id: secrets
        run: |
          if [ -n "$STELLAR_COORDINATOR_SECRET" ]; then
            echo "stellar_configured=true" >> "$GITHUB_ENV"
          else
            echo "stellar_configured=false" >> "$GITHUB_ENV"
          fi
        env:
          STELLAR_COORDINATOR_SECRET: ${{ secrets.STELLAR_COORDINATOR_SECRET }}

      - name: Run full pipeline E2E tests
        run: |
          npx jest tests/e2e/full-pipeline.test.ts \
            --testTimeout=125000 \
            --forceExit \
            --config tests/e2e/jest.config.js
        env:
          NODE_ENV: test
          SKIP_STELLAR_ACCOUNT_VERIFY: "true"
          RUN_STELLAR_E2E_TESTS: ${{ env.stellar_configured == 'true' && 'true' || (github.event.inputs.run_stellar == 'true' && 'true' || 'false') }}
          STELLAR_COORDINATOR_SECRET: ${{ secrets.STELLAR_COORDINATOR_SECRET }}
          STELLAR_COORDINATOR_PUBLIC_KEY: ${{ secrets.STELLAR_COORDINATOR_PUBLIC_KEY }}
          STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"
          STELLAR_NETWORK: testnet
          AGENT_RESEARCH_ADDRESS: ${{ secrets.AGENT_RESEARCH_ADDRESS }}
          AGENT_RISK_ADDRESS: ${{ secrets.AGENT_RISK_ADDRESS }}
          AGENT_CODING_ADDRESS: ${{ secrets.AGENT_CODING_ADDRESS }}
          AGENT_DESIGN_ADDRESS: ${{ secrets.AGENT_DESIGN_ADDRESS }}
          AGENT_REPORT_ADDRESS: ${{ secrets.AGENT_REPORT_ADDRESS }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY || 'test-placeholder' }}
          DATABASE_URL: ":memory:"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pipeline-results-${{ github.run_id }}
          path: |
            junit-e2e.xml
          if-no-files-found: ignore
          retention-days: 7

      # ── Page maintainers on breakage ──────────────────────────────────────
      - name: Open / update breakage issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'e2e-pipeline-failure';
            const title = 'E2E Pipeline Tests failing (nightly)';
            const body = [
              '## ⚠️ Nightly E2E Pipeline Test Failure',
              '',
              'The nightly full 5-agent pipeline E2E test has failed.',
              'These tests cover the complete Research → Risk → Coding → Design → Report',
              'DAG execution, payment releases, idempotency, and (when configured)',
              'Stellar testnet payment verification via Horizon.',
              '',
              `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- **Commit:** \`${context.sha.slice(0, 8)}\``,
              '',
              'Please check the workflow logs and test artifact for details.',
              '',
              '_This issue is auto-generated by the nightly E2E pipeline workflow._',
            ].join('\n');

            const q = `repo:${context.repo.owner}/${context.repo.repo} in:title is:issue is:open "${title}"`;
            const { data: { items } } = await github.rest.search.issuesAndPullRequests({ q });
            if (items.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: items[0].number,
                body: `Still failing on ${context.sha.slice(0, 8)}. See run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }

      - name: Close breakage issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'E2E Pipeline Tests failing (nightly)';
            const q = `repo:${context.repo.owner}/${context.repo.repo} in:title is:issue is:open "${title}"`;
            const { data: { items } } = await github.rest.search.issuesAndPullRequests({ q });
            for (const issue of items) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Nightly E2E pipeline tests have recovered. All checks passed on \`${context.sha.slice(0, 8)}\`.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
