name: Docker Security

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-security.yml'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-security.yml'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          tags: ai-net-backend:ci
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          tags: ai-net-frontend:ci
          load: true

      - name: Run Trivy vulnerability scanner (backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-net-backend:ci
          format: sarif
          output: trivy-backend.sarif
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '1'
          ignore-unfixed: false

      - name: Run Trivy vulnerability scanner (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-net-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '1'
          ignore-unfixed: false

      - name: Upload backend SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload frontend SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Fail on CRITICAL vulns only
        shell: bash
        run: |
          set -euo pipefail
          echo "Security scan complete. Critical findings are treated as blocking failures."
