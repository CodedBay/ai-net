name: Secrets Scan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: trufflehog-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history lets TruffleHog scan all commits in the PR delta.
          fetch-depth: 0

      - name: TruffleHog OSS scan
        uses: trufflesecurity/trufflehog@v3.97.9
        with:
          # On PRs scan only the delta; on push/dispatch scan the full history.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'HEAD' }}
          extra_args: >-
            --only-verified
            --fail

      - name: Upload TruffleHog results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trufflehog-report-${{ github.run_id }}
          path: trufflehog-results.json
          retention-days: 14
          if-no-files-found: ignore
