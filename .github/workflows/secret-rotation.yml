name: Emergency Secret Rotation

"on":
  workflow_dispatch:
    inputs:
      secret_name:
        description: Secret to rotate
        required: true
        type: choice
        options: [JWT_SECRET, VENICE_API_KEY]
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      new_value:
        description: New value (required for VENICE_API_KEY; leave empty for JWT_SECRET)
        required: false
        type: string
      confirm:
        description: Type CONFIRM to proceed in production
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate inputs
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SECRET_NAME: ${{ inputs.secret_name }}
          NEW_SECRET_VALUE: ${{ inputs.new_value }}
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          if [[ "$ENVIRONMENT" == "production" && "$CONFIRMATION" != "CONFIRM" ]]; then
            echo "::error::Production rotation requires CONFIRM."
            exit 1
          fi
          if [[ "$SECRET_NAME" == "VENICE_API_KEY" && -z "$NEW_SECRET_VALUE" ]]; then
            echo "::error::VENICE_API_KEY requires the manually renewed key."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROTATION_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update secret
        env:
          SECRET_NAME: ${{ inputs.secret_name }}
          ENVIRONMENT: ${{ inputs.environment }}
          NEW_SECRET_VALUE: ${{ inputs.new_value }}
        run: |
          if [[ "$SECRET_NAME" == "JWT_SECRET" ]]; then
            SECRET_ID="ai-net/${ENVIRONMENT}/jwt_secret"
          else
            SECRET_ID="ai-net/${ENVIRONMENT}/venice_api_key"
          fi
          if [[ -z "$NEW_SECRET_VALUE" ]]; then
            NEW_SECRET_VALUE="$(openssl rand -hex 64)"
          fi
          echo "::add-mask::${NEW_SECRET_VALUE}"
          aws secretsmanager put-secret-value --secret-id "$SECRET_ID" --secret-string "$NEW_SECRET_VALUE"

      - name: Roll ECS service and wait for stability
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          CLUSTER="ai-net-${ENVIRONMENT}"
          SERVICE="ai-net-${ENVIRONMENT}-backend"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment --region "$AWS_REGION"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE" --region "$AWS_REGION"

      - name: Notify Slack on success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SECRET_NAME: ${{ inputs.secret_name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ -n "$SLACK_WEBHOOK_URL" ]]; then
            curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' \
              --data "$(jq -n --arg text "Secret ${SECRET_NAME} rotated in ${ENVIRONMENT}; ECS service is stable." '{text:$text}')" \
              "$SLACK_WEBHOOK_URL"
          fi

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SECRET_NAME: ${{ inputs.secret_name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ -n "$SLACK_WEBHOOK_URL" ]]; then
            curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' \
              --data "$(jq -n --arg text "Secret rotation failed for ${SECRET_NAME} in ${ENVIRONMENT}. Check the workflow and ECS deployment." '{text:$text}')" \
              "$SLACK_WEBHOOK_URL"
          fi
