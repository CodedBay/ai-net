[package]
name = "task-store-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
task_store = { path = "..", features = [] }
soroban-sdk = { version = "=22.0.11", features = ["testutils"] }

[[bin]]
name = "fuzz_task_ids"
path = "src/fuzz_task_ids.rs"
test = false
doc = false

[[bin]]
name = "fuzz_task_status_transitions"
path = "src/fuzz_task_status_transitions.rs"
test = false
doc = false

[profile.release]
debug = 1

[profile.dev]
opt-level = 1
